<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Masuk & Pendaftaran</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-container {
      display: flex;
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    /* Pembagian 2 Kolom: Kiri (Login), Kanan (Pendaftaran) */
    .auth-col {
      flex: 1;
      padding: 40px;
    }
    .auth-col.login-section {
      border-right: 1px solid #e0e0e0;
      background-color: #fafafa;
    }
    .auth-col.register-section {
      background-color: #ffffff;
    }
    h2 {
      margin-bottom: 8px;
      color: #333;
    }
    p.subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #444;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #007bff;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .btn-login {
      background-color: #007bff;
    }
    .btn-register {
      background-color: #28a745;
    }
    @media (max-width: 768px) {
      .auth-container {
        flex-direction: column;
      }
      .auth-col.login-section {
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
      }
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Kiri: Form Login -->
    <div class="auth-col login-section">
      <h2>Masuk Akun</h2>
      <p class="subtitle">Silakan login jika sudah memiliki akun</p>
      
      <form id="form-login">
        <div class="form-group">
          <label for="login-phone">Nomor WhatsApp / HP</label>
          <input type="tel" id="login-phone" placeholder="Contoh: 08123456789" required>
        </div>
        <div class="form-group">
          <label for="login-password">Kata Sandi</label>
          <input type="password" id="login-password" placeholder="Masukkan kata sandi" required>
        </div>
        <button type="submit" class="btn-login">Masuk ke Aplikasi</button>
      </form>
    </div>

    <!-- Kanan: Form Pendaftaran -->
    <div class="auth-col register-section">
      <h2>Daftar Baru</h2>
      <p class="subtitle">Buat akun baru untuk mulai mencatat keuangan</p>
      
      <form id="form-register">
        <div class="form-group">
          <label for="reg-name">Nama Lengkap</label>
          <input type="text" id="reg-name" placeholder="Nama lengkap Anda" required>
        </div>
        <div class="form-group">
          <label for="reg-phone">Nomor WhatsApp / HP</label>
          <input type="tel" id="reg-phone" placeholder="Contoh: 08123456789" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Kata Sandi</label>
          <input type="password" id="reg-password" placeholder="Buat kata sandi" required>
        </div>
        <button type="submit" class="btn-register">Daftar Akun Baru</button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');

      // -------------------------------------------------------------
      // 1. LOGIKA LOGIN (SEBELAH KIRI)
      // -------------------------------------------------------------
      formLogin.addEventListener('submit', function (e) {
        e.preventDefault();

        const phone = document.getElementById('login-phone').value.trim();
        const password = document.getElementById('login-password').value;

        // Ambil data registeredUsers dari localStorage (milik IndexApp)
        const registeredUsers = JSON.parse(localStorage.getItem('finance_registered_users') || '[]');

        // Cari user yang sesuai
        const user = registeredUsers.find(u => u.phone === phone && u.password === password);

        if (user) {
          // Set active session agar IndexApp langsung masuk ke Dashboard
          localStorage.setItem('finance_active_session', JSON.stringify(user));
          alert(`Selamat datang kembali, ${user.name}!`);
          window.location.href = 'indexApp.html';
        } else {
          alert('Nomor HP atau kata sandi tidak cocok/belum terdaftar.');
        }
      });

      // -------------------------------------------------------------
      // 2. LOGIKA PENDAFTARAN (SEBELAH KANAN)
      // -------------------------------------------------------------
      formRegister.addEventListener('submit', function (e) {
        e.preventDefault();

        const name = document.getElementById('reg-name').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const password = document.getElementById('reg-password').value;

        let registeredUsers = JSON.parse(localStorage.getItem('finance_registered_users') || '[]');

        // Cek jika nomor HP sudah terdaftar di IndexApp
        const existingUser = registeredUsers.find(u => u.phone === phone);
        if (existingUser) {
          alert('Nomor HP sudah terdaftar. Silakan gunakan form login di sebelah kiri.');
          return;
        }

        // Buat data user baru (mengikuti skema objek IndexApp)
        const newUser = {
          name: name,
          phone: phone,
          password: password,
          photo: ""
        };

        // Simpan ke database utama registeredUsers milik IndexApp
        registeredUsers.push(newUser);
        localStorage.setItem('finance_registered_users', JSON.stringify(registeredUsers));

        // Inisialisasi storage transaksi per-user (mengikuti skema IndexApp)
        localStorage.setItem(`finance_history_desktop_${phone}`, JSON.stringify([]));
        localStorage.setItem(`finance_pengeluaran_desktop_${phone}`, JSON.stringify([]));
        localStorage.setItem(`finance_kasbon_desktop_${phone}`, JSON.stringify([]));
        localStorage.setItem(`finance_backup_desktop_${phone}`, JSON.stringify([]));

        // Buat akun langsung otomatis login
        localStorage.setItem('finance_active_session', JSON.stringify(newUser));

        alert('Pendaftaran berhasil! Mengalihkan ke aplikasi...');
        window.location.href = 'indexApp.html';
      });
    });
  </script>
</body>
</html>
